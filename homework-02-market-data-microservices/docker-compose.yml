services:

  pricing-service:
    build: ./pricing-service
    ports:
      - "8002:8002"
    environment:
      - MARKET_DATA_URL=http://market-data-service:8001/stream

  market-data-service:
    build: ./market-data-service
    ports:
      - "8001:8001"
  
  monitoring-service:
    build: ./monitoring-service
    ports:
      - "8003:8003"
    environment:
      - MARKET_DATA_HEALTH_URL=http://market-data-service:8001/health
      - PRICING_HEALTH_URL=http://pricing-service:8002/health
    depends_on:
      - market-data-service
      - pricing-service
